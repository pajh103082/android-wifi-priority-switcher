plugins { id 'com.android.application' }

android {
    namespace 'com.claude.wifipriority'
    compileSdk 34
    defaultConfig {
        applicationId 'com.claude.wifipriority'
        minSdk 26
        // 刻意設為 28：Android 10 起，只有 targetSdk <= 28 的 App 才能指定手機連到哪個 Wi-Fi
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }
}
